name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    # A real Postgres, because there is no useful way to fake schema
    # introspection. The bucket tests need a storage service and are skipped
    # here; they run in the `storage` job below.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: graine
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pgraine"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 3306:3306

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # Not a service container: those cannot override the command, and Mongo
      # needs --replSet before it will run a multi-document transaction.
      - name: Start MongoDB as a replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 \
            --replSet rs0 --bind_ip_all
          for _ in $(seq 1 60); do
            docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' \
              >/dev/null 2>&1 && break
            sleep 1
          done
          docker exec mongo mongosh --quiet --eval \
            'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          # Wait for the node to finish electing itself primary.
          for _ in $(seq 1 30); do
            [ "$(docker exec mongo mongosh --quiet --eval 'rs.status().myState')" = 1 ] && break
            sleep 1
          done

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features
      # SQLite needs no service and always runs. The fixture suite reads the
      # same variables.
      - name: Test
        env:
          GRAINE_TEST_PG: postgres://postgres:postgres@localhost:5432
          GRAINE_TEST_MYSQL: mysql://root:graine@127.0.0.1:3306
          GRAINE_TEST_MONGO: mongodb://127.0.0.1:27017
        run: cargo test --all-features

      # The default build must stay clean too: `mongo` is optional, and an
      # unused import behind the feature gate would only show up here.
      - run: cargo clippy --all-targets

  storage:
    name: storage (supabase)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: supabase init --force && supabase start

      - name: Test buckets
        run: |
          # The CLI's local keys are fixed and public, so reading them here is
          # not a secret leak.
          echo "GRAINE_TEST_PG=postgres://postgres:postgres@127.0.0.1:54322" >> "$GITHUB_ENV"
          echo "GRAINE_TEST_STORAGE_URL=http://127.0.0.1:54321" >> "$GITHUB_ENV"
          echo "GRAINE_TEST_STORAGE_KEY=$(supabase status -o json | jq -r .SERVICE_ROLE_KEY)" >> "$GITHUB_ENV"
      - run: cargo test --test buckets

  msrv:
    name: minimum supported rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      # Building the library is enough to catch a newer-Rust feature slipping in.
      - run: cargo check --all-features
