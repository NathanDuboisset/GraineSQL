[package]
name = "grainesql"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Nathan Duboisset <nathanduboisset@delosintelligence.fr>"]
description = "Deterministic, git-friendly database seed export and load for Postgres and MySQL"
# Not an SPDX identifier, so crates.io needs the file itself. PolyForm
# Noncommercial is source-available, not open source: commercial use needs a
# separate licence from the copyright holder.
license-file = "LICENSE"
repository = "https://github.com/NathanDuboisset/grainesql"
homepage = "https://github.com/NathanDuboisset/grainesql"
documentation = "https://docs.rs/grainesql"
readme = "README.md"
keywords = ["database", "postgres", "seed", "fixtures", "supabase"]
categories = ["command-line-utilities", "database"]
# Keep the published crate to the source that builds it.
exclude = [
    ".github/",
    "dist/",
    "packaging/",
    "tests/",
    "TODO.md",
]

# The crate is `grainesql`; the command you type is `graine`.
[[bin]]
name = "graine"
path = "src/main.rs"

# Release binaries are what most people install, so optimise them properly.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# cargo-binstall finds prebuilt binaries from GitHub Releases instead of
# compiling, which turns `cargo binstall grainesql` into a download.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.{ archive-format }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[features]
default = []
# MongoDB is off by default: it adds ~60 crates, and the relational binary
# most people install should not carry them.
mongo = ["dep:mongodb", "dep:bson"]

[dependencies]
anyhow = "1"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
csv = "1"
flate2 = "1"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
indexmap = { version = "2", features = ["serde"] }
rust_decimal = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip"] }
ryu = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
serde_yaml_ng = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite",
    "uuid", "chrono", "rust_decimal", "json",
] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde"] }

# MongoDB, behind the `mongo` feature. rustls-tls is the same rustls 0.23 +
# ring that sqlx's tls-rustls-ring already pins, so there is one TLS stack.
# dns-resolver is what makes `mongodb+srv://` (Atlas) work.
bson = { version = "2", optional = true }
mongodb = { version = "3", optional = true, default-features = false, features = [
    "rustls-tls", "dns-resolver", "bson-2", "compat-3-3-0",
] }

[dev-dependencies]
sha2 = "0.10"
# The MySQL test harness talks to the server directly rather than shelling out
# to a client that may not be installed.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "sqlite",
] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
